name: Build and Release AegisDesk Shell

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Marcar como pre-release'
        type: boolean
        default: false

env:
  INNO_SETUP_VERSION: '6.4.3'

jobs:
  build:
    name: Build, sign and attest inputs
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout at immutable commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve version from the triggering ref
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
            if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Tag de release inválido: $version" }
          } else {
            $version = '0.1.0-dev'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up exact Go toolchain from go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: shell/go.mod
          cache-dependency-path: shell/go.sum

      - name: Verify canonical legal documents are synchronized
        shell: pwsh
        run: node worker/scripts/sync-legal.mjs --check

      - name: Install pinned Inno Setup with a required checksum
        shell: pwsh
        env:
          INNO_SETUP_SHA256: ${{ vars.INNO_SETUP_SHA256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:INNO_SETUP_SHA256)) {
            throw "TODO: configurar la variable de repositorio INNO_SETUP_SHA256 con el SHA-256 verificado de Inno Setup $env:INNO_SETUP_VERSION antes de publicar."
          }
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_SETUP_VERSION.exe"
          $url = "https://files.jrsoftware.org/is/6/innosetup-$env:INNO_SETUP_VERSION.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:INNO_SETUP_SHA256.Trim().ToLower()) { throw "Hash de Inno Setup no coincide: $actual" }
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -NoNewWindow

      - name: Build shell and installer
        shell: pwsh
        working-directory: shell
        env:
          AEGISDESK_STATE_PUBLIC_KEY_BASE64: ${{ vars.AEGISDESK_STATE_PUBLIC_KEY_BASE64 }}
        run: |
          $publicKey = $env:AEGISDESK_STATE_PUBLIC_KEY_BASE64
          if ([string]::IsNullOrWhiteSpace($publicKey)) { throw "Falta AEGISDESK_STATE_PUBLIC_KEY_BASE64; no se publica un shell sin verificador Ed25519." }
          $buildArgs = @{
            Version = '${{ steps.version.outputs.version }}'
            Installer = $true
            PublicKeyBase64 = $publicKey.Trim()
          }
          if ('${{ vars.AEGISDESK_WORKER_BASE_URL }}') {
            $buildArgs['WorkerBaseURL'] = '${{ vars.AEGISDESK_WORKER_BASE_URL }}'
            $buildArgs['StateIssuer'] = '${{ vars.AEGISDESK_WORKER_BASE_URL }}'
          }
          .\build.ps1 @buildArgs

      - name: Sign Authenticode artifacts on release tags
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)) {
            throw 'Faltan SIGNING_CERT_PFX_BASE64 o SIGNING_CERT_PASSWORD; una release por tag debe quedar firmada.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'aegisdesk-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "$env:ProgramFiles\Windows Kits\10\bin\*\x64\signtool.exe", "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'No se encontró signtool.exe en el runner.' }
          Get-ChildItem shell/bin/AegisDesk.exe, shell/dist/*.exe | ForEach-Object {
            & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $pfx /p $env:SIGNING_CERT_PASSWORD $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Falló la firma de $($_.FullName)" }
            & $signtool.FullName verify /pa /all $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Falló la verificación Authenticode de $($_.FullName)" }
          }

      - name: Generate SBOM and SHA256SUMS
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP 'aegisdesk-release'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item shell/bin/AegisDesk.exe, shell/dist/*.exe, THIRD_PARTY_NOTICES.md, LICENSE, SECURITY.md $releaseDir -Force
          $packages = @(go -C shell list -deps -f '{{with .Module}}{{.Path}}|{{.Version}}{{end}}' ./cmd/aegisdesk | Sort-Object -Unique | Where-Object { $_ -and $_ -notmatch '^aegisdesk-shell\|' })
          $sbomPackages = foreach ($line in $packages) {
            $parts = $line -split '\|', 2
            [ordered]@{
              SPDXID = "SPDXRef-Package-$([Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($parts[0])).Replace('=','').Replace('/','_').Replace('+','-'))"
              name = $parts[0]
              versionInfo = $parts[1]
              downloadLocation = 'NOASSERTION'
              licenseConcluded = 'NOASSERTION'
              licenseDeclared = 'NOASSERTION'
            }
          }
          [ordered]@{
            spdxVersion = 'SPDX-2.3'
            dataLicense = 'CC0-1.0'
            SPDXID = 'SPDXRef-DOCUMENT'
            name = 'AegisDesk Go runtime'
            documentNamespace = "https://aegisdesk.example.invalid/spdx/${{ github.sha }}"
            creationInfo = [ordered]@{ created = (Get-Date).ToUniversalTime().ToString('o'); creators = @('Tool: AegisDesk release workflow') }
            packages = @($sbomPackages)
          } | ConvertTo-Json -Depth 8 | Out-File (Join-Path $releaseDir 'sbom.spdx.json') -Encoding utf8
          Get-ChildItem $releaseDir -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } | Out-File (Join-Path $releaseDir 'SHA256SUMS') -Encoding ascii
          "release_dir=$releaseDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload immutable build bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AegisDesk-v${{ steps.version.outputs.version }}-Windows
          path: ${{ runner.temp }}/aegisdesk-release
          retention-days: 30

  release:
    name: Publish verified release
    if: ${{ github.ref_type == 'tag' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download immutable build bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: AegisDesk-v${{ needs.build.outputs.version }}-Windows
          path: release

      - name: Attest release artifacts
        id: attest
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-path: 'release/*.exe'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            release/*
            ${{ steps.attest.outputs.bundle-path }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Release AegisDesk Shell

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Marcar como pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: 🚀 Build, Package & Release Shell
    runs-on: windows-latest

    steps:
      - name: ⬇️ Checkout Código Fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📐 Calcular Próxima Versión Semántica
        id: semver
        shell: pwsh
        run: |
          $exactTag = (git tag --points-at HEAD) | Where-Object { $_ -match "^v\d" } | Select-Object -First 1
          if ($exactTag) {
            $version = $exactTag.TrimStart('v')
            $versionTag = $exactTag
          } else {
            $latestTag = (git tag -l "v*" --sort=-v:refname) | Select-Object -First 1
            if (-not $latestTag) {
              $version = "0.1.0"
            } else {
              $clean = $latestTag.TrimStart('v')
              $parts = $clean.Split('.')
              $major = [int]$parts[0]
              $minor = [int]$parts[1]
              $patch = [int]$parts[2]

              $commits = git log "$latestTag..HEAD" --oneline
              $isMajor = $false
              $isMinor = $false
              $hasCommits = $false

              foreach ($c in $commits) {
                if (-not [string]::IsNullOrWhiteSpace($c)) {
                  $hasCommits = $true
                  if ($c -match "(?i)BREAKING CHANGE|breaking:") {
                    $isMajor = $true
                  } elseif ($c -match "(?i)feat(\([^\)]+\))?:") {
                    $isMinor = $true
                  }
                }
              }

              if ($isMajor) {
                $major++
                $minor = 0
                $patch = 0
              } elseif ($isMinor) {
                $minor++
                $patch = 0
              } elseif ($hasCommits) {
                $patch++
              }
              $version = "$major.$minor.$patch"
            }
            $versionTag = "v$version"
          }
          Write-Host "✅ Versión calculada: $version (Tag: $versionTag)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version_tag=$versionTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 🔧 Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: shell/go.mod
          cache-dependency-path: shell/go.sum

      - name: 🛠️ Instalar Inno Setup
        run: choco install innosetup --no-progress

      - name: 📦 Compilar Binario y Empaquetar Instalador con Inno Setup
        shell: pwsh
        working-directory: shell
        run: |
          $ver = "${{ steps.semver.outputs.version }}"
          Write-Host "Compilando AegisDesk Shell versión $ver..."
          $buildArgs = @{
            Version = $ver
            Installer = $true
          }
          if ("${{ vars.AEGISDESK_WORKER_BASE_URL }}") {
            $buildArgs["WorkerBaseURL"] = "${{ vars.AEGISDESK_WORKER_BASE_URL }}"
            $buildArgs["StateIssuer"] = "${{ vars.AEGISDESK_WORKER_BASE_URL }}"
          }
          .\build.ps1 @buildArgs

      - name: 📊 Reportar tamaño de artefactos
        shell: pwsh
        working-directory: shell
        run: |
          Get-ChildItem -Path bin/AegisDesk.exe, dist/*.exe | ForEach-Object {
            "{0} -> {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - name: 📤 Subir Artefactos al Run
        uses: actions/upload-artifact@v4
        with:
          name: AegisDesk-v${{ steps.semver.outputs.version }}-Windows
          path: |
            shell/dist/*.exe
            shell/bin/AegisDesk.exe
          retention-days: 30

      - name: 🚀 Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.version_tag }}
          name: Release ${{ steps.semver.outputs.version_tag }}
          body: |
            ## 📦 Artefactos Oficiales de AegisDesk (SIDC)

            | Archivo | Tipo | Descripción |
            | :--- | :--- | :--- |
            | **`AegisDesk-Setup-v${{ steps.semver.outputs.version }}.exe`** | **Instalador Oficial (Inno Setup)** | **Recomendado para Terminales.** Asistente guiado de instalación, configuración inicial, acceso directo en Escritorio para SIDC y desinstalador limpio. |
            | **`AegisDesk.exe`** | **Binario Portable** | Ejecutable de escritorio independiente. |

            ---
            *Desarrollado para el ecosistema SIDC.*
          files: |
            shell/dist/*.exe
            shell/bin/AegisDesk.exe
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
